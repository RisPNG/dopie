name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content 'bootstrap/Start DoPie.ps1' -Raw)) | Out-Null"
