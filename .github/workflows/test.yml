name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --require-hashes -r application/base/requirements.lock
      - run: python -m pip install -e "application/base[dev]"
      - run: python -m ruff check --config application/base/pyproject.toml .
      - run: python -m pytest -c application/base/pyproject.toml tests
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        shell: pwsh
        run: "[scriptblock]::Create((Get-Content 'bootstrap/Start DoPie.ps1' -Raw)) | Out-Null"
