id = "text-counter"
name = "Text Counter"
version = "1.0.0"
description = "Count the words, characters, and lines in pasted text."
interface = "standard"
operation = "backend:run"
category = "Text"
author = "DoPie"
license = "MIT"
api-version = 1
python = ">=3.11"
platforms = ["linux", "win32"]

[[inputs]]
id = "text"
label = "Text"
type = "multiline"
required = true
placeholder = "Paste or type text here"
