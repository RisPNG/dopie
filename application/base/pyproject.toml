[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dopie"
version = "1.1.3"
description = "A cross-platform Python desktop shell for Slices"
readme = { text = "DoPie is a source-run desktop platform for focused Python automation Slices.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=45",
    "packaging>=24",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dopie"]

[project.scripts]
dopie = "dopie.application:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dopie"]

[tool.pytest.ini_options]
pythonpath = ["src"]
