[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dopie"
version = "0.1.0"
description = "A cross-platform Python desktop shell for Slices"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "cryptography>=45",
    "packaging>=24",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.scripts]
dopie = "dopie.application:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dopie"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
